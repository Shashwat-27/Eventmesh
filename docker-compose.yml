services:
  postgres:
    image: postgres:17
    container_name: eventmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventmesh
      POSTGRES_PASSWORD: eventmesh_dev
      POSTGRES_DB: eventmesh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eventmesh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: